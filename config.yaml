# Settings for the X posting system. Times are stored in Doha time (UTC+3); slots target US Eastern hours (see below).

# auto    = posts with status "ready" go out on their own
# approve = only posts you change to status "approved" go out
mode: auto

# true = never call X, just log what would be posted (also forced when .env has no keys)
dry_run: false

# A queued post must wait this long before it can go out,
# so you can open the queue and delete it or set status: hold.
min_lead_minutes: 60

max_posts_per_day: 20
max_replies_per_day: 40
tip_pause_until: 2026-11-15   # X blocks crypto addresses for 7 days after app authorization
min_gap_minutes: 60

# Automatic reposts (only accounts with repost_ok: true in watchlist.yaml)
max_reposts_per_day: 2
min_repost_gap_minutes: 60

# Preferred time slots used by the drafting task to pick post_at.
# Audience is the US, so slots follow US Eastern time (EST = UTC-5 from Nov 1, 2026; Doha = ET + 8h).
# Stored in Doha time like everything else in this repo. 90 min apart so the 60-min gap never delays them.
#   15:30 = 7:30am ET (pre-market, commute)   17:00 = 9:00am ET (daily deep-dive thread)
#   18:30 = 10:30am ET (smart-money report)   20:00 = 12:00pm ET (lunch)
#   21:30 = 1:30pm ET                          23:00 = 3:00pm ET (last hour of trading)
#   00:30 = 4:30pm ET (after the close)        02:00 = 6:00pm ET (evening)
#   04:00 = 8:00pm ET (US evening, crypto crowd)
# US data releases (CPI, jobs) come out at 8:30am ET = 16:30 Doha: put previews at 15:30 and
# the reaction post right after the release.
slots: ["15:30", "17:00", "18:30", "20:00", "21:30", "23:00", "00:30", "02:00", "04:00"]

# Account is not Premium, so posts are capped at 280 weighted characters.
max_chars: 280

handle: "@issam0pc4u"

# X API search of watchlist accounts. Each post returned costs $0.005.
# Hourly in US hours (2026-11-08): 160 reads/day max ≈ $0.80/day ≈ $24/month. Set 0 to turn the scanner off.
scan_max_reads_per_day: 160
scan_reads_per_run: 10

# Tips. Any queue file with `tip: true` gets this as its last post (the daily deep-dive
# thread always does). Network matters: BNB Smart Chain (BEP-20) only.
tip_address: "0x9b4d1d2030e39095c4b6ff80dcf50b77d79af36c"
tip_network: "BNB Smart Chain (BEP-20)"
tip_post: |-
  If this thread helped you, you can support the research with a tip.

  BNB Smart Chain (BEP-20) only:
  0x9b4d1d2030e39095c4b6ff80dcf50b77d79af36c

  No coins shilled here, ever.
